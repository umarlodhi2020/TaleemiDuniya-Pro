<!doctype html>
<html lang="en" class="dark-mode">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0f17" />
    <meta name="description" content="TaleemiDunya Pro - Premium Multi-Tenant SaaS School Management System" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TaleemiDunya Pro" />
    <title>TaleemiDunya Pro — School Management SaaS</title>
    <script>
      (function() {
        // Auto-redirect deep paths into HashRouter to prevent blank page when entered without #
        try {
          var p = window.location.pathname;
          if (p && p !== '/' && p !== '/index.html' && !window.location.hash) {
            window.location.replace('/#' + p + window.location.search);
            return;
          }
        } catch (e) {}

        try {
          var saved = localStorage.getItem('taleemi_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            document.documentElement.classList.remove('dark', 'dark-mode');
            document.documentElement.classList.add('light-mode');
          } else {
            document.documentElement.classList.remove('light-mode');
            document.documentElement.classList.add('dark', 'dark-mode');
          }
        } catch (e) {
          document.documentElement.classList.add('dark', 'dark-mode');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
