<!doctype html>
<html lang="en" class="dark-mode">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0f17" />
    <meta name="description" content="TaleemiDunya Pro - Premium Multi-Tenant SaaS School Management System" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TaleemiDunya Pro" />
    <title>TaleemiDunya Pro — School Management SaaS</title>
    <script>
      // Dark mode is PERMANENT. Light mode is session-only (temporary).
      (function() {
        // Always restore dark on load — light mode is never saved permanently
        localStorage.setItem('taleemi_theme', 'dark');
        // Remove any old forced-light flags
        localStorage.removeItem('taleemi_theme_forced_light_v2');
        document.documentElement.classList.add('dark-mode');
        document.documentElement.classList.remove('light-mode');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
